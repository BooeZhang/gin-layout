[server]
host = "0.0.0.0"
port = 8080
mode = "release"

[database]
driver = "mysql"
host = "mysql"
port = 3306
user = "root"
password = "root123"
database = "gin_layout"
maxOpenConns = 100
maxIdleConns = 10
connMaxLifetime = 3600

[redis]
mode = "single"
addrs = ["redis:6379"]
password = ""
db = 0
poolSize = 100

[jwt]
secret = "your-secret-key-change-in-production"
accessExpired = 300
refreshExpired = 43200

[casbin]
modelPath = "etc/casbin_model.conf"

[log]
level = "info"
format = "json"
service = "gin-layout"
environment = "production"
version = "1.0.0"
caller = true
color = false
time_format = "2006-01-02T15:04:05.000Z07:00"

[log.output]
stdout = true
stderr = false

#[log.output.file]
#filename = "logs/app.log"
#max_size = 100
#max_backups = 3
#max_age = 7
#compress = true
#local_time = true


[apidoc]
title = "Gin Layout API"
version = "1.0.0"
description = "Gin Layout API 文档"

[initializer]
adminAccount = "admin"
adminPassword = "admin123"
adminRoleName = "超级管理员"
adminRoleCode = "ADMIN"
menuJSON = "internal/bootstrap/initializer/menu.json"
